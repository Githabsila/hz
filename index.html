<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Лиды без сайта</title>
<meta name="description" content="Находит малый бизнес без сайта и показывает, куда ему написать">
<meta name="theme-color" content="#0e1117">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <header class="hdr">
      <form id="cityForm" class="search">
        <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="cityInput" type="search" placeholder="Город или район" autocomplete="off" enterkeyhint="search">
        <button type="button" id="geoBtn" class="ibtn" title="Рядом со мной" aria-label="Рядом со мной">
          <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg>
        </button>
        <button type="submit" id="goBtn" class="btn primary">Найти</button>
      </form>
      <button type="button" id="filtersBtn" class="ibtn square" title="Настройки" aria-label="Настройки">
        <svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </header>

    <div class="chips" id="cats"></div>

    <div class="tools">
      <label class="tgl"><input type="checkbox" id="optNoSite" checked><span>Без сайта</span></label>
      <label class="tgl"><input type="checkbox" id="optMsg"><span>Можно написать</span></label>
      <label class="tgl"><input type="checkbox" id="optPhone"><span>С телефоном</span></label>
      <select id="optStatus" class="sel" aria-label="Статус"><option value="">Все статусы</option></select>
    </div>

    <div class="stats">
      <span id="stats"></span>
      <span id="status" class="status"></span>
      <button type="button" id="csvBtn" class="btn ghost sm" disabled>
        <svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>CSV
      </button>
    </div>
    <div class="progress"><i></i></div>

    <div id="list" class="list">
      <div class="empty">
        <div class="empty-ico">🎯</div>
        <h2>Найдём клиентов без сайта</h2>
        <p>Введите город, выберите сферы и нажмите <b>Найти</b></p>
      </div>
    </div>
  </aside>

  <section id="mapPane" class="mappane">
    <div id="map"></div>
    <button type="button" id="searchBtn" class="btn primary float">
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Искать здесь
    </button>
  </section>
</div>

<nav class="seg" aria-label="Вид">
  <button type="button" data-tab="list" class="active">Список <b id="countBadge"></b></button>
  <button type="button" data-tab="map">Карта</button>
</nav>

<dialog id="filters" class="sheet">
  <form method="dialog">
    <div class="sheet-hdr">
      <h2>Настройки</h2>
      <button class="ibtn" value="close" aria-label="Закрыть">
        <svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>

    <div class="field">
      <span class="lbl">Источник данных</span>
      <div class="segctl">
        <label><input type="radio" name="src" value="2gis"><span>2ГИС</span></label>
        <label><input type="radio" name="src" value="osm"><span>OpenStreetMap</span></label>
      </div>
      <select id="optSource" hidden><option value="2gis"></option><option value="osm"></option></select>
    </div>

    <div class="field gis-only">
      <span class="lbl">Ключ API 2ГИС <a href="https://platform.2gis.ru/" target="_blank" rel="noopener">получить</a></span>
      <input id="gisKey" class="inp" type="password" placeholder="xxxxxxxx-xxxx-…" autocomplete="off">
    </div>
    <div class="field gis-only">
      <span class="lbl">Глубина поиска <small>страниц на запрос, тратит лимит ключа</small></span>
      <input id="gisPages" class="inp narrow" type="number" min="1" max="20" value="5">
    </div>

    <div class="field">
      <span class="lbl">Фильтры</span>
      <label class="sw"><input type="checkbox" id="optSocialOk" checked><i></i>Страница VK/Instagram — это не сайт</label>
      <label class="sw"><input type="checkbox" id="optNoChains" checked><i></i>Скрывать сетевые бренды</label>
      <label class="sw"><input type="checkbox" id="optHideRejected" checked><i></i>Скрывать «Отказ»</label>
    </div>

    <div class="field">
      <span class="lbl">Текст сообщения <small>{name} {category} {address}</small></span>
      <textarea id="tplText" class="inp" rows="5"></textarea>
    </div>
  </form>
</dialog>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="app.js"></script>
</body>
</html>
